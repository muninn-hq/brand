<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Muninn Labs Mark">
  <defs>
    <linearGradient id="muninn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="muninn-wing" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#muninn-bg)"/>

  <!-- Memory ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 10"/>

  <!-- Geometric raven wing / folded memory glyph -->
  <path d="M 140 332 L 228 144 L 304 220 L 372 164 L 316 340 L 244 274 Z" fill="url(#muninn-wing)"/>

  <!-- Memory lattice nodes -->
  <line x1="228" y1="144" x2="372" y2="164" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.45"/>
  <circle cx="228" cy="144" r="9" fill="#F1F5F9"/>
  <circle cx="372" cy="164" r="11" fill="#38BDF8"/>
  <circle cx="304" cy="220" r="7" fill="#818CF8"/>
</svg>
